<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotty Playback History</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101214; color: #e7ebef; }
  main { width: min(980px, calc(100% - 32px)); margin: 36px auto 64px; }
  header { display: flex; gap: 16px; justify-content: space-between; align-items: end; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 28px 0 10px; font-size: 15px; color: #aeb7bd; font-weight: 650; }
  p { margin: 4px 0 0; }
  .muted { color: #8e989f; font-size: 13px; }
  a.button { border: 1px solid #3a444b; border-radius: 8px; background: #23292e; color: #e7ebef; padding: 8px 11px; text-decoration: none; white-space: nowrap; }
  a.button:hover { background: #2b3338; }
  .day { margin-top: 26px; }
  .entry { display: grid; grid-template-columns: 92px minmax(0,1fr) minmax(130px,220px); gap: 14px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid #293036; }
  .entry:last-child { border-bottom: 0; }
  .time { color: #8e989f; font-variant-numeric: tabular-nums; }
  .title { font-weight: 650; }
  .meta { color: #aeb7bd; margin-top: 2px; font-size: 13px; }
  .device { color: #8e989f; text-align: right; font-size: 13px; }
  .empty { background: #181c1f; border: 1px solid #293036; border-radius: 12px; padding: 22px; color: #8e989f; }
  @media (max-width: 650px) {
    header { align-items: start; flex-direction: column; }
    .entry { grid-template-columns: 70px minmax(0,1fr); }
    .device { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Playback history</h1>
      <p class="muted">Tracks observed during Spotty-managed playback sessions</p>
    </div>
    <a class="button" href="/">Back to dashboard</a>
  </header>
  <div id="summary" class="muted">Loading…</div>
  <div id="history"></div>
</main>
<script>
const historyEl = document.getElementById('history');
const summaryEl = document.getElementById('summary');

function dayLabel(date) {
  return new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).format(date);
}
function timeLabel(date) {
  return new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(date);
}

async function loadHistory() {
  try {
    const response = await fetch('/api/history?limit=1000', { cache: 'no-store' });
    const data = await response.json();
    if (!response.ok || data?.ok === false) throw new Error(data?.error || `HTTP ${response.status}`);

    summaryEl.textContent = `${data.total.toLocaleString()} track${data.total === 1 ? '' : 's'} logged · showing newest ${data.returned.toLocaleString()}`;
    historyEl.replaceChildren();

    if (!data.entries.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No Spotty-managed playback has been logged yet.';
      historyEl.append(empty);
      return;
    }

    let currentDay = '';
    let dayContainer = null;
    for (const entry of data.entries) {
      const date = new Date(entry.played_at);
      const day = date.toLocaleDateString();
      if (day !== currentDay) {
        currentDay = day;
        const heading = document.createElement('h2');
        heading.textContent = dayLabel(date);
        historyEl.append(heading);
        dayContainer = document.createElement('div');
        dayContainer.className = 'day';
        dayContainer.style.marginTop = '0';
        historyEl.append(dayContainer);
      }

      const row = document.createElement('div'); row.className = 'entry';
      const time = document.createElement('div'); time.className = 'time'; time.textContent = timeLabel(date);
      const body = document.createElement('div');
      const title = document.createElement('div'); title.className = 'title'; title.textContent = entry.track_name || 'Untitled';
      const meta = document.createElement('div'); meta.className = 'meta';
      const details = [entry.artist_name, entry.album_name].filter(Boolean);
      meta.textContent = details.join(' · ');
      body.append(title, meta);
      const device = document.createElement('div'); device.className = 'device'; device.textContent = entry.device_name || 'Unknown device';
      row.append(time, body, device);
      dayContainer.append(row);
    }
  } catch (error) {
    summaryEl.textContent = 'History unavailable';
    historyEl.innerHTML = '';
    const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = error.message; historyEl.append(empty);
  }
}

loadHistory();
</script>
</body>
</html>
